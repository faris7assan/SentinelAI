title: certutil download or decode activity
id: 07715331-85f6-496a-ad79-dbe4009ba504
status: experimental
level: high
description: |
    Detects Windows certutil usage commonly associated with file transfer or decoding
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'certutil'
            - '-urlcache'
            - '-decode'
    condition: selection
tags:
    - attack.t1105
    - attack.t1140
falsepositives:
    - Legitimate admin activity
