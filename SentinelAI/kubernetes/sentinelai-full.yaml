---
# ============================================================
# SentinelAI Kubernetes Manifests
# All services, deployments, and configs
# ============================================================

# ─── Namespace ──────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: sentinelai
  labels:
    app.kubernetes.io/name: sentinelai
    environment: production

---
# ─── ConfigMap ──────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinelai-config
  namespace: sentinelai
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  OPENSEARCH_HOST: "opensearch-service"
  OPENSEARCH_PORT: "9200"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "sentinelai"
  OLLAMA_BASE_URL: "http://ollama-service:11434"
  PLATFORM_NAME: "SentinelAI"
  ENVIRONMENT: "production"

---
# ─── Secret (base64-encode values in production) ────────────
apiVersion: v1
kind: Secret
metadata:
  name: sentinelai-secrets
  namespace: sentinelai
type: Opaque
stringData:
  JWT_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_SEALED_SECRETS"
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  OPENSEARCH_PASSWORD: "CHANGE_ME_OPENSEARCH_PASSWORD"
  VIRUSTOTAL_API_KEY: ""
  ABUSEIPDB_API_KEY: ""
  ALIENVAULT_OTX_KEY: ""

---
# ─── PostgreSQL ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sentinelai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: sentinelai-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              value: sentinelai
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinelai-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: sentinelai
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
# ─── Redis ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sentinelai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: sentinelai
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
# ─── Auth Service ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: sentinelai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: sentinelai/auth-service:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: sentinelai-config
            - secretRef:
                name: sentinelai-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: sentinelai
spec:
  selector:
    app: auth-service
  ports:
    - port: 8001
      targetPort: 8001

---
# ─── Detection Engine ────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection-engine
  namespace: sentinelai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: detection-engine
  template:
    metadata:
      labels:
        app: detection-engine
    spec:
      containers:
        - name: detection-engine
          image: sentinelai/detection-engine:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: sentinelai-config
            - secretRef:
                name: sentinelai-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: detection-engine
  namespace: sentinelai
spec:
  selector:
    app: detection-engine
  ports:
    - port: 8003
      targetPort: 8003

---
# ─── AI Service ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: sentinelai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: sentinelai/ai-service:latest
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: sentinelai-config
            - secretRef:
                name: sentinelai-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"

---
# ─── Frontend ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sentinelai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: sentinelai/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://sentinelai.yourdomain.com"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://sentinelai.yourdomain.com"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: sentinelai
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000

---
# ─── Ingress ─────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinelai-ingress
  namespace: sentinelai
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/enable-websocket: "true"
spec:
  tls:
    - hosts:
        - sentinelai.yourdomain.com
      secretName: sentinelai-tls
  rules:
    - host: sentinelai.yourdomain.com
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: alert-service
                port:
                  number: 8007
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000

---
# ─── PersistentVolumeClaims ──────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: sentinelai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
# ─── HorizontalPodAutoscaler ─────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: detection-engine-hpa
  namespace: sentinelai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: detection-engine
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
