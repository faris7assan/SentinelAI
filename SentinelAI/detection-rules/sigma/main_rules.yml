title: DNS Tunneling Detection
id: SIG-005
status: stable
description: Detects anomalously long DNS subdomain queries which may indicate data exfiltration via DNS tunneling
author: SentinelAI Detection Team
date: 2024/01/01
tags:
  - attack.command_and_control
  - attack.t1071.004
  - attack.exfiltration
logsource:
  product: network
  service: dns
detection:
  keywords:
    - regex: '[a-zA-Z0-9+/]{40,}\.'
  condition: keywords
falsepositives:
  - CDN providers with long encoded hostnames
  - Some legitimate security tools
level: high
