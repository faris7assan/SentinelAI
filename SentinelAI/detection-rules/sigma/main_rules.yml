title: SSH Brute Force Attack
id: SIG-001
status: stable
description: Detects multiple failed SSH authentication attempts from a single source IP indicating brute force activity
author: SentinelAI Detection Team
date: 2024/01/01
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.001
logsource:
  product: linux
  service: auth
detection:
  keywords:
    - 'Failed password'
    - 'Invalid user'
    - 'authentication failure'
  condition: keywords
  timeframe: 1m
  condition_count: 5
falsepositives:
  - Legitimate users forgetting password
  - Password manager misconfiguration
level: high
---
title: Reverse Shell via Bash
id: SIG-002
status: stable
description: Detects classic bash reverse shell patterns used by attackers to establish C2 channels
author: SentinelAI Detection Team
date: 2024/01/01
tags:
  - attack.execution
  - attack.t1059.004
  - attack.command_and_control
logsource:
  product: linux
  service: auditd
detection:
  keywords:
    - 'bash -i'
    - '/dev/tcp/'
    - 'exec 5<>/dev/tcp'
    - 'bash -c "bash -i'
  condition: keywords
falsepositives:
  - Legitimate network debugging scripts
level: critical
---
title: Suspicious PowerShell Execution Flags
id: SIG-003
status: stable
description: Detects PowerShell execution with common attacker flags for obfuscation and policy bypass
author: SentinelAI Detection Team
date: 2024/01/01
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
logsource:
  product: windows
  service: powershell
detection:
  keywords:
    - '-EncodedCommand'
    - '-enc '
    - '-NoProfile -NonInteractive -ExecutionPolicy Bypass'
    - '-WindowStyle Hidden'
    - 'IEX(New-Object'
    - 'Invoke-Expression'
  condition: keywords
falsepositives:
  - Legitimate admin scripts using encoded commands
  - Software deployment tools
level: high
